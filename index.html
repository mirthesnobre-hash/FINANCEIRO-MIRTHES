<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirthes Nobre · Controle Financeiro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f5fc; --surface:#ffffff; --surface-2:#efe6f8; --line:#ddccec;
    --text:#3f2a52; --muted:#8b7699; --green:#7c5cbf; --gold:#e0a458; --red:#e0555f; --cyan:#b98cc9;
    --shadow:0 4px 18px rgba(124,92,191,.08);
    --mono:'JetBrains Mono', monospace; --display:'Playfair Display', serif; --body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:var(--body); min-height:100vh; -webkit-font-smoothing:antialiased; }
  ::selection{ background:var(--green); color:#faf7fd; }

  /* ---------- Cabeçalho ---------- */
  header.top{
    padding:20px 24px 16px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background: radial-gradient(ellipse 900px 220px at 0% 0%, rgba(124,92,191,.07), transparent 70%),
                radial-gradient(ellipse 500px 160px at 100% 0%, rgba(224,164,88,.08), transparent 70%);
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ width:42px; height:42px; flex-shrink:0; color:var(--green); }
  .brand-name{ font-family:var(--display); font-weight:800; font-size:25px; line-height:1.15; }
  .brand-name b{ color:var(--green); font-style:italic; font-weight:700; }
  .brand-sub{ font-size:11.5px; color:var(--muted); }
  header.top .spacer{ flex:1; }
  .hdr-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .hdr-actions select{
    background:var(--surface); border:1px solid var(--line); color:var(--text);
    padding:8px 10px; border-radius:20px; font-family:var(--mono); font-size:13px; font-weight:700;
  }
  @media (max-width:760px){ header.top .spacer{ display:none; } }

  nav.tabs{ display:flex; gap:4px; padding:0 24px; border-bottom:1px solid var(--line); overflow-x:auto; background:var(--surface); }
  nav.tabs button{
    background:none; border:none; color:var(--muted); font-family:var(--display);
    font-size:17px; font-weight:700; padding:14px 16px 12px; cursor:pointer;
    border-bottom:3px solid transparent; white-space:nowrap;
  }
  nav.tabs button.active{ color:var(--green); border-bottom-color:var(--green); }
  nav.tabs button:hover{ color:var(--green); }

  main{ padding:22px 24px 90px; max-width:980px; margin:0 auto; }
  section.panel{ display:none; animation:fadein .25s ease; }
  section.panel.active{ display:block; }
  @keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow); }
  h3.card-title{ font-family:var(--display); font-size:19px; margin:0 0 12px; font-weight:700; color:var(--green); }
  .footnote{ color:var(--muted); font-size:12px; margin-top:8px; line-height:1.5; }
  .muted{ color:var(--muted); font-size:12px; }

  /* ---------- Botões ---------- */
  .btn{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:8px 16px; border-radius:20px; font-family:var(--body); font-weight:600; font-size:13px;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .btn:hover{ border-color:var(--green); }
  .btn.primary{ background:var(--green); color:#faf7fd; border-color:var(--green); }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.ghost{ background:none; }
  .btn.danger:hover{ border-color:var(--red); color:var(--red); }
  .btn.sm{ padding:5px 11px; font-size:12px; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .lock-btn{ background:var(--surface); border:1px solid var(--line); color:var(--muted); padding:7px 12px; border-radius:20px; cursor:pointer; font-size:13px; font-weight:600; }
  .lock-btn.locked{ border-color:var(--red); color:var(--red); background:rgba(224,85,95,.08); }
  .save-indicator{ font-family:var(--mono); font-size:11px; color:var(--green); opacity:0; transition:opacity .3s; }
  .save-indicator.show{ opacity:1; }

  /* ---------- Meu mês ---------- */
  .hero{ background:linear-gradient(135deg, var(--surface-2), var(--surface)); border:2px solid var(--green); }
  .hero .lbl{ font-family:var(--mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .hero .big{ font-family:var(--mono); font-size:46px; font-weight:700; line-height:1.15; margin:4px 0 10px; }
  .conta{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; padding-top:12px; border-top:1px solid var(--line); }
  .conta div{ display:flex; flex-direction:column; gap:2px; }
  .conta span{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .conta b{ font-family:var(--mono); font-size:17px; }
  @media (max-width:560px){ .conta{ grid-template-columns:1fr; } .conta div{ flex-direction:row; justify-content:space-between; } .hero .big{ font-size:38px; } }

  .acao{ display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .acao:last-child{ border-bottom:none; }
  .acao .n{ font-family:var(--display); font-weight:800; font-size:21px; color:var(--gold); line-height:1.05; flex-shrink:0; width:18px; }
  .acao .t{ flex:1; }

  .bar{ height:10px; background:var(--surface-2); border-radius:10px; overflow:hidden; margin-top:6px; }
  .bar i{ display:block; height:100%; border-radius:10px; }
  .teto-linha{ font-size:15px; }
  .teto-linha b{ font-family:var(--mono); font-size:22px; }
  .teto-edit{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); font-size:13px; }
  .teto-edit label{ color:var(--muted); }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .chip{ background:var(--surface-2); border-radius:20px; padding:5px 12px; font-size:12px; }
  .chip b{ font-family:var(--mono); }
  .chip-btn{ background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:8px 14px; font-size:13px; cursor:pointer; color:var(--text); font-family:var(--body); }
  .chip-btn b{ font-family:var(--mono); font-weight:700; margin-left:4px; }
  .chip-btn.on{ background:var(--green); color:#fff; border-color:var(--green); }
  .linha-v{ padding:6px 0; font-size:13px; }
  .linha-v .top{ display:flex; justify-content:space-between; gap:10px; }
  .linha-v .top b{ font-family:var(--mono); }
  .destaque{ padding:10px 14px; border-radius:10px; background:var(--surface-2); border-left:5px solid var(--gold); font-size:13.5px; margin-bottom:10px; }
  .pl-tag{ font-family:var(--mono); font-size:11px; font-weight:700; }

  /* ---------- Lançar o mês ---------- */
  .fc-step{ display:flex; gap:14px; }
  .fc-num{ flex-shrink:0; width:34px; height:34px; border-radius:50%; background:var(--surface-2); color:var(--muted); font-family:var(--display); font-weight:800; font-size:17px; display:flex; align-items:center; justify-content:center; }
  .fc-num.ok{ background:var(--green); color:#fff; }
  .fc-in{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:6px; font-family:var(--mono); font-size:14px; width:120px; text-align:right; }
  .fc-txt{ background:transparent; border:1px solid transparent; color:var(--text); padding:6px 6px; border-radius:6px; font-family:var(--body); font-size:14px; flex:1; min-width:0; }
  .fc-txt:hover{ border-color:var(--line); }
  .fc-txt:focus, .fc-in:focus{ outline:none; border-color:var(--green); background:var(--surface-2); }
  .fc-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; flex-wrap:wrap; }
  .fc-row:last-child{ border-bottom:none; }
  .fc-chk{ width:21px; height:21px; accent-color:var(--green); cursor:pointer; flex-shrink:0; }
  .chk{ display:flex; align-items:center; gap:8px; flex:1; min-width:160px; }
  .row-r{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .fixo{ background:none; border:1px solid var(--line); border-radius:20px; padding:4px 8px; cursor:pointer; font-size:12px; opacity:.35; }
  .fixo.on{ opacity:1; border-color:var(--green); background:var(--surface-2); }
  .pago-txt{ color:var(--muted); text-decoration:line-through; }
  details.mini{ margin-top:10px; }
  details.mini summary{ cursor:pointer; font-size:12.5px; color:var(--green); font-weight:600; }
  .x-btn{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; padding:2px 6px; }
  .x-btn:hover{ color:var(--red); }

  /* ---------- Faturas (tabela) ---------- */
  .fat-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .table-wrap{ background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:auto; max-height:65vh; box-shadow:var(--shadow); }
  table{ border-collapse:collapse; width:100%; font-size:12.5px; table-layout:fixed; }
  thead th{ position:sticky; top:0; background:var(--surface-2); text-align:left; padding:10px 10px; font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); border-bottom:1px solid var(--line); white-space:nowrap; z-index:1; }
  tbody td{ padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  tbody tr:hover{ background:var(--surface-2); }
  td input{ background:transparent; border:1px solid transparent; color:var(--text); font-family:inherit; font-size:inherit; padding:4px 5px; border-radius:4px; width:100%; }
  td input:hover{ border-color:var(--line); }
  td input:focus{ border-color:var(--green); outline:none; background:var(--surface-2); }
  td input.num-in{ font-family:var(--mono); text-align:right; }
  tr.row-pendente td{ background:rgba(224,164,88,.07); }
  .row-actions button{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; padding:2px 4px; }
  .row-actions button:hover{ color:var(--red); }
  .empty-state{ text-align:center; padding:36px 20px; color:var(--muted); font-size:13px; }
  .status-toggle{ display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:20px; font-family:var(--mono); font-size:11px; font-weight:700; border:1px solid transparent; cursor:pointer; user-select:none; }
  .status-toggle input{ display:none; }
  .status-toggle.is-pending{ background:rgba(224,164,88,.16); color:#a8712c; border-color:rgba(224,164,88,.45); }
  .status-toggle.is-ok{ background:rgba(124,92,191,.12); color:var(--green); border-color:rgba(124,92,191,.32); }
  .status-toggle .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

  @media (max-width:720px){
    .table-wrap{ max-height:none; overflow:visible; background:none; border:none; box-shadow:none; }
    table.responsive-cards{ table-layout:auto; }
    table.responsive-cards colgroup, table.responsive-cards thead{ display:none; }
    table.responsive-cards, table.responsive-cards tbody{ display:block; width:100%; }
    table.responsive-cards tr{ display:block; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:6px 14px; margin-bottom:12px; }
    table.responsive-cards tr.row-pendente{ border-color:rgba(224,164,88,.6); }
    table.responsive-cards td{ display:flex; align-items:center; justify-content:space-between; gap:12px; white-space:normal; overflow:visible; padding:8px 0; border-bottom:1px solid var(--line); background:none !important; }
    table.responsive-cards td:last-child{ border-bottom:none; justify-content:flex-end; }
    table.responsive-cards td::before{ content:attr(data-label); font-family:var(--mono); font-size:10.5px; text-transform:uppercase; color:var(--muted); flex-shrink:0; }
    table.responsive-cards td[data-label=""]::before, table.responsive-cards td[colspan]::before{ content:none; }
    table.responsive-cards td[colspan]{ display:block; }
    table.responsive-cards input{ text-align:right; }
  }

  .toast{ position:fixed; left:50%; bottom:70px; transform:translateX(-50%); background:var(--text); color:#fff; padding:12px 18px; border-radius:12px; font-size:13.5px; z-index:9000; max-width:92vw; box-shadow:0 8px 24px rgba(0,0,0,.2); }

  /* ---------- Carro ---------- */
  .car-hero{ background:linear-gradient(135deg, #f3ecfb, #fff 60%, #fdf3e6); border:2px solid var(--gold); }
  .tipo-grid{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .tipo-btn{ background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:7px 12px; font-size:13px; cursor:pointer; color:var(--text); font-family:var(--body); }
  .tipo-btn.on{ background:var(--gold); border-color:var(--gold); color:#fff; font-weight:700; }
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .form-grid label{ display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .form-grid input, .form-grid select{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:9px 10px; border-radius:8px; font-family:var(--body); font-size:14px; width:100%; }
  .form-grid input:focus, .form-grid select:focus{ outline:none; border-color:var(--green); }
  .form-grid input.num{ font-family:var(--mono); text-align:right; }
  .car-item{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px; flex-wrap:wrap; }
  .car-item:last-child{ border-bottom:none; }
  .car-ico{ width:36px; height:36px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .car-item .info{ flex:1; min-width:150px; }
  .car-item .info small{ color:var(--muted); display:block; margin-top:2px; font-size:11.5px; }
  .pag-tag{ font-family:var(--mono); font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; background:var(--surface-2); color:var(--muted); }
  .pag-tag.cartao{ background:rgba(185,140,201,.18); color:#8a5a9c; }
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
  .kpi{ background:var(--surface-2); border-radius:12px; padding:12px 14px; }
  .kpi span{ display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .kpi b{ font-family:var(--mono); font-size:19px; display:block; margin-top:3px; }
  .kpi small{ font-size:11.5px; color:var(--muted); }
  .dica{ display:flex; gap:10px; padding:8px 0; font-size:13.5px; border-bottom:1px dashed var(--line); }
  .dica:last-child{ border-bottom:none; }

  /* ---------- Meu mês: grade de resumos ---------- */
  .tiles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
  .tile{ text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 13px; cursor:pointer; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:2px; font-family:var(--body); color:var(--text); min-height:96px; }
  .tile:hover{ border-color:var(--green); }
  .tile.on{ border:2px solid var(--green); background:linear-gradient(135deg,#f6f0fd,#fff); }
  .tile-t{ font-size:12.5px; font-weight:600; color:var(--muted); display:flex; justify-content:space-between; gap:4px; }
  .tile-seta{ color:var(--green); }
  .tile-v{ font-family:var(--mono); font-size:19px; font-weight:700; line-height:1.2; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tile-v.sm{ font-family:var(--body); font-size:15px; white-space:normal; }
  .tile-s{ font-size:11.5px; color:var(--muted); line-height:1.35; }
  .tile .bar{ display:block; width:100%; }
  .sec-aberta{ scroll-margin-top:10px; animation:fadein .2s ease; }

  .qa-grid.ct-grid{ grid-template-columns:1fr 150px 110px 130px; }
  .esconde{ display:none !important; }
  @media (max-width:640px){ .qa-grid.ct-grid{ grid-template-columns:1fr 1fr; } }
  .ct-grupo{ margin-top:14px; }
  .ct-gh{ display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-size:13px; font-weight:700; padding-bottom:6px; border-bottom:2px solid var(--surface-2); }
  .ct-item{ border-bottom:1px solid var(--line); }
  .ct-item.pago{ opacity:.72; }
  .ct-main{ display:flex; align-items:center; gap:10px; padding:9px 2px; cursor:pointer; font-size:14px; }
  .ct-main:hover{ background:var(--surface-2); }
  .ct-nome{ flex:1; min-width:0; line-height:1.3; }
  .ct-chk{ display:flex; }
  .ct-acoes{ display:flex; gap:2px; flex-shrink:0; }
  .ic-btn{ background:none; border:1px solid transparent; border-radius:8px; cursor:pointer; font-size:14px; padding:5px 7px; color:var(--muted); }
  .ic-btn:hover{ border-color:var(--line); background:var(--surface); }
  .ic-btn.del:hover{ color:var(--red); border-color:var(--red); }

  /* ---------- Cartões ---------- */
  .qa-card{ border:2px solid var(--green); background:linear-gradient(135deg,#f6f0fd,#fff 70%); }
  .qa-row{ display:flex; gap:8px; }
  .qa-in{ flex:1; min-width:0; font-size:17px; padding:13px 14px; border-radius:12px; border:1px solid var(--line); background:#fff; color:var(--text); font-family:var(--body); }
  .qa-in:focus{ outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(124,92,191,.15); }
  .qa-grid{ display:grid; grid-template-columns:140px 1fr 150px 120px; gap:10px; }
  .qa-grid label{ display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .qa-grid input, .qa-grid select{ font-size:16px; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--text); font-family:var(--body); width:100%; }
  .qa-grid input.num{ font-family:var(--mono); text-align:right; }
  .qa-grid input:focus, .qa-grid select:focus{ outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(124,92,191,.15); }
  @media (max-width:640px){ .qa-grid{ grid-template-columns:1fr 1fr; } .qa-grid .qa-desc{ grid-column:1 / -1; order:-1; } }
  .qa-prev{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; font-size:12.5px; min-height:24px; align-items:center; }
  .prev-pill{ background:var(--surface-2); border-radius:20px; padding:4px 10px; }
  .prev-pill.dest{ background:rgba(124,92,191,.12); color:var(--green); }
  .cards-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; margin-bottom:16px; }
  .cc{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; cursor:pointer; box-shadow:var(--shadow); }
  .cc.on{ border:2px solid var(--green); }
  .cc-top{ display:flex; justify-content:space-between; gap:6px; align-items:center; font-size:14px; }
  .cc-lbl{ font-size:11.5px; color:var(--muted); margin-top:6px; }
  .cc-val{ font-family:var(--mono); font-size:22px; font-weight:700; margin:2px 0; }
  .cc-prox{ font-size:12px; margin-top:4px; }
  .cp{ border-bottom:1px solid var(--line); }
  .cp.pend{ background:rgba(224,164,88,.07); }
  .cp-main{ display:flex; align-items:center; gap:10px; padding:10px 4px; cursor:pointer; font-size:14px; }
  .cp-main:hover{ background:var(--surface-2); }
  .cp-data{ font-family:var(--mono); font-size:11.5px; color:var(--muted); width:40px; flex-shrink:0; }
  .cp-desc{ flex:1; min-width:0; }
  .cp-val{ font-family:var(--mono); white-space:nowrap; }
  .cp-edit{ padding:6px 4px 14px; }

  /* ---------- Calendário, gráfico ---------- */
  .cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
  .cal-h{ font-family:var(--mono); font-size:10.5px; color:var(--muted); padding:2px 0; }
  .cal-d{ position:relative; padding:7px 0 11px; border-radius:8px; background:var(--surface-2); font-family:var(--mono); font-size:12.5px; }
  .cal-d.hoje{ outline:2px solid var(--green); background:var(--surface); font-weight:700; }
  .cal-d i{ position:absolute; left:50%; bottom:3px; width:7px; height:7px; margin-left:-3.5px; border-radius:50%; }
  .dia-in{ width:46px !important; text-align:center !important; padding:6px 4px !important; font-size:12.5px !important; }

<script>
window.__PDFJS_WORKER__ = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>
<script>
// =====================================================================
// Controle Financeiro Pessoal — versão simplificada
// Usa exatamente os mesmos dados salvos da versão anterior.
// =====================================================================

// ---------- Armazenamento local (quando não estiver na nuvem) ----------
if (!window.storage){
  const PREFIXO = 'fin-pessoal:';
  window.storage = {
    async get(key){ const raw = localStorage.getItem(PREFIXO + key); if (raw === null) throw new Error('not found'); return { key, value: raw }; },
    async set(key, value){ localStorage.setItem(PREFIXO + key, value); return { key, value }; },
    async delete(key){ localStorage.removeItem(PREFIXO + key); return { key, deleted:true }; },
    async list(prefix){
      const p = PREFIXO + (prefix||''), keys = [];
      for (let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if (k && k.startsWith(p)) keys.push(k.slice(PREFIXO.length)); }
      return { keys, prefix: prefix||'' };
    }
  };
}
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = window.__PDFJS_WORKER__;

const $ = id => document.getElementById(id);
const MES_NOMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES_SEMENTE = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; })();
const DESPESAS_PADRAO = ['Internet Residencial','Celular','Plano de Saúde','Cílios','Unha (Pé e Mão)','Depilação','Passeios','Restaurantes','Gastos Gerais'];
const CARTOES_PADRAO = ['Porto Seguro','Nubank','Mercado Pago'];

const fmtBRL = v => (Number(v)||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const fmtNum = v => (Number(v)||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const normHeader = s => String(s??'').trim().toUpperCase();
const uid = () => Math.random().toString(36).slice(2,10);
const escAttr = s => String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const esc = t => String(t ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const semAcento = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
const hojeISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmtData = iso => { const m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; };
// Lê a data digitada (dd/mm/aaaa, dd/mm/aa ou dd/mm). Vazio = sem data; inválida = null.
function lerDataDigitada(txt){
  const t = String(txt||'').trim(); if (!t) return '';
  const m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2}|\d{4}))?$/); if (!m) return null;
  const dia = +m[1], mes = +m[2];
  let ano = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : Number(mesAtivo.split('-')[0]);
  if (mes < 1 || mes > 12 || dia < 1 || dia > new Date(ano, mes, 0).getDate()) return null;
  return `${ano}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
}
const ehTerc = i => !!(i.terceiro && String(i.terceiro).trim());
// "3", "3x" ou "1/3" -> "1/3"; vazio -> "1/1"
function lerParcela(t){ t = String(t||'').trim().toLowerCase().replace(/\s+/g,''); if (!t) return '1/1';
  let m = t.match(/^(\d{1,2})\/(\d{1,2})$/); if (m && +m[1] >= 1 && +m[1] <= +m[2]) return `${+m[1]}/${+m[2]}`;
  m = t.match(/^(\d{1,2})x?$/); if (m && +m[1] >= 1) return `1/${+m[1]}`; return null; }

function labelMes(chave){ const [ano, mes] = chave.split('-').map(Number); return `${MES_NOMES[mes-1]}/${ano}`; }
function proximoMes(chave){ const [ano, mes] = chave.split('-').map(Number); const d = new Date(ano, mes, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }

function parseValorBR(s){
  const limpo = String(s).replace(/−/g,'-').replace(/[R$\s]/g,'').replace(/\.(?=\d{3}(?:,|$))/g,'').replace(',', '.');
  const v = parseFloat(limpo);
  return isNaN(v) ? 0 : v;
}

// ---------- Estado ----------
let mesesDisponiveis = [];
let mesAtivo = MES_SEMENTE;
let dados = novoMesVazio();
let cartaoAtivo = CARTOES_PADRAO[0];
let plano = { tetoCartao:0, regrasCat:{}, carro:{ teto:0, anuais:[], ultimoPag:'pix', cartao:'' }, guardado:{ conta:'Caixa Econômica', pessoas:[] }, caixinhas:[], tetoCat:{}, vencCartao:{}, fechCartao:{} };
let guardForm = { pessoa:'', tipo:'in', valor:'', data:'', obs:'' };

// ---------- Carro: tipos de gasto e formas de pagamento ----------
const CARRO_TIPOS = [
  ['combustivel','⛽','Combustível'],
  ['manutencao','🔧','Manutenção'],
  ['estacionamento','🅿️','Estacionamento'],
  ['lavagem','🧼','Lavagem'],
  ['pedagio','🛣️','Pedágio'],
  ['parcela','💰','Parcela do carro'],
  ['seguro','🛡️','Seguro'],
  ['documentos','📄','IPVA / Documentos'],
  ['multa','⚠️','Multa'],
  ['outros','📦','Outros'],
];
const TIPOS_FIXOS = ['parcela','seguro'];
const tipoInfo = k => CARRO_TIPOS.find(t => t[0] === k) || CARRO_TIPOS[CARRO_TIPOS.length-1];
const PAGAMENTOS = [['pix','Pix / débito'],['dinheiro','Dinheiro'],['cartao','Cartão de crédito']];
const pagLabel = k => String(k||'').startsWith('card:') ? '💳 ' + k.slice(5) : (PAGAMENTOS.find(p => p[0] === k) || PAGAMENTOS[0])[1];
let carroForm = { tipo:'combustivel', valor:'', data:'', pag:null, desc:'', litros:'', km:'', fixo:false, parc:'' };

function novoMesVazio(){
  return {
    saldos: { 'Caixa Econômica': 0, 'Sicoob': 0 },
    salarios: { 'ILED': 0, 'X-LED': 0, 'Outros': 0 },
    despesas: DESPESAS_PADRAO.map(nome => ({ id: uid(), nome, valor: 0, fixo:false, grupoFixoId:null, pago:false })),
    reservas: [],
    cartoes: Object.fromEntries(CARTOES_PADRAO.map(c => [c, []])),
    cartaoPago: {},
    carro: { itens: [] },
    trancado: false,
  };
}
// Garante que meses antigos tenham todos os campos esperados
function normalizar(d){
  if (!d) return d;
  d.saldos = d.saldos || {}; d.salarios = d.salarios || {};
  d.despesas = d.despesas || []; d.reservas = d.reservas || [];
  d.cartoes = d.cartoes || {}; d.cartaoPago = d.cartaoPago || {};
  d.carro = d.carro || { itens: [] }; d.carro.itens = d.carro.itens || [];
  d.carro.itens.forEach(x => { if (!x.id) x.id = uid(); });
  d.despesas.forEach(x => { if (!x.id) x.id = uid(); });
  Object.values(d.cartoes).forEach(l => (l||[]).forEach(i => { if (!i.id) i.id = uid(); }));
  return d;
}

// ---------- Salvar / carregar ----------
const chaveMes = c => `mes:${c}`;
async function salvarIndice(){ try{ await window.storage.set('meses-indice', JSON.stringify(mesesDisponiveis), false); }catch(e){ console.error(e); } }
async function carregarIndice(){ try{ const r = await window.storage.get('meses-indice', false); if (r?.value) return JSON.parse(r.value); }catch(e){} return null; }
async function salvarMesAtivoPref(){ try{ await window.storage.set('mes-ativo', mesAtivo, false); }catch(e){} }
async function carregarMesAtivoPref(){ try{ const r = await window.storage.get('mes-ativo', false); if (r?.value) return r.value; }catch(e){} return null; }
async function salvarDados(){ try{ await window.storage.set(chaveMes(mesAtivo), JSON.stringify(dados), false); return true; }catch(e){ console.error('Erro ao salvar', e); return false; } }
async function carregarDados(chave){ try{ const r = await window.storage.get(chaveMes(chave), false); if (r?.value) return normalizar(JSON.parse(r.value)); }catch(e){} return null; }
async function salvarPlano(){ try{ await window.storage.set('plano', JSON.stringify(plano), false); }catch(e){ console.error(e); } }
async function carregarPlano(){
  try{ const r = await window.storage.get('plano', false); if (r?.value) plano = Object.assign({ tetoCartao:0, regrasCat:{} }, JSON.parse(r.value)); }catch(e){}
  if (!plano.regrasCat) plano.regrasCat = {};
  plano.carro = Object.assign({ teto:0, anuais:[], ultimoPag:'pix', cartao:'' }, plano.carro || {});
  if (!Array.isArray(plano.carro.anuais)) plano.carro.anuais = [];
  plano.guardado = Object.assign({ conta:'Caixa Econômica', pessoas:[] }, plano.guardado || {});
  if (!Array.isArray(plano.guardado.pessoas)) plano.guardado.pessoas = [];
  if (!Array.isArray(plano.caixinhas)) plano.caixinhas = [];
  plano.tetoCat = plano.tetoCat || {}; plano.vencCartao = plano.vencCartao || {}; plano.fechCartao = plano.fechCartao || {};
}

function flashSave(){ const el = $('saveInd'); el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 1200); }
let saveTimer = null;
function autoSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{ const ok = await salvarDados(); if (ok) flashSave(); else avisoFalhaSalvar(); }, 400);
}
async function salvarAgora(){
  clearTimeout(saveTimer);
  const ok = await salvarDados();
  if (ok) flashSave(); else avisoFalhaSalvar();
  const btn = $('btnSalvarAgora'), original = '💾 Salvar';
  btn.textContent = ok ? `✅ Salvo às ${new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}` : '❌ NÃO salvou';
  setTimeout(()=>{ btn.textContent = original; }, 1800);
}
function avisoFalhaSalvar(){
  if ($('avisoFalha')) return;
  const a = document.createElement('div'); a.id = 'avisoFalha';
  a.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:10000;background:var(--red);color:#fff;padding:12px 16px;font-size:14px;font-weight:600;text-align:center;cursor:pointer';
  a.textContent = '⚠ NÃO consegui salvar. Confira a internet/login e use ⬇ Backup para não perder nada. (clique para fechar)';
  a.onclick = () => a.remove(); document.body.appendChild(a);
}
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 6000);
}

// ---------- Meses ----------
function estruturaBaseDeMes(origem){
  return {
    saldos: Object.fromEntries(Object.keys(origem.saldos).map(k=>[k,0])),
    salarios: Object.fromEntries(Object.keys(origem.salarios).map(k=>[k,Number(origem.salarios[k])||0])),
    despesas: origem.despesas.map(d => d.fixo
      ? { id: uid(), nome: d.nome, valor: d.valor, fixo:true, grupoFixoId: d.grupoFixoId, pago:false, dia: d.dia || null }
      : { id: uid(), nome: d.nome, valor: 0, fixo:false, grupoFixoId:null, pago:false, dia: d.dia || null }),
    reservas: [], // dinheiro dos outros agora fica na aba 🤝 Guardado (vale para todos os meses)
    cartoes: Object.fromEntries(Object.keys(origem.cartoes).map(c => [c, []])),
    cartaoPago: {},
    // do carro, só os gastos fixos (parcela, seguro…) passam para o mês novo
    carro: { itens: ((origem.carro && origem.carro.itens) || []).filter(i => i.fixo).map(i => ({
      id: uid(), data:'', tipo: i.tipo, descricao: i.descricao, valor: i.valor, pagamento: i.pagamento,
      litros:0, km:0, fixo:true, grupoFixoId: i.grupoFixoId, pago:false })) },
    trancado: false,
  };
}
async function abrirMes(chave){
  mesAtivo = chave;
  let d = await carregarDados(chave);
  if (!d){ d = novoMesVazio(); await window.storage.set(chaveMes(chave), JSON.stringify(d), false); }
  dados = normalizar(d);
  cartaoAtivo = Object.keys(dados.cartoes)[0] || CARTOES_PADRAO[0];
  carroForm.data = '';
  await salvarMesAtivoPref();
  renderTudo();
}
async function criarNovoMes(){
  const sugestao = proximoMes(mesesDisponiveis[mesesDisponiveis.length-1] || mesAtivo);
  const escolha = prompt('Criar novo mês (formato AAAA-MM). Contas fixas, salário e cartões são copiados.', sugestao);
  if (!escolha) return;
  const chave = escolha.trim();
  if (!/^\d{4}-\d{2}$/.test(chave)){ alert('Formato inválido. Use AAAA-MM, ex: 2026-11'); return; }
  if (mesesDisponiveis.includes(chave)){ await abrirMes(chave); return; }
  mesesDisponiveis.push(chave); mesesDisponiveis.sort(); await salvarIndice();
  dados = estruturaBaseDeMes(dados); mesAtivo = chave;
  cartaoAtivo = Object.keys(dados.cartoes)[0] || CARTOES_PADRAO[0];
  await salvarDados(); await salvarMesAtivoPref(); renderTudo();
}
function popularSeletorMes(){
  $('selMes').innerHTML = mesesDisponiveis.map(c => `<option value="${c}" ${c===mesAtivo?'selected':''}>${labelMes(c)}</option>`).join('');
}

// ---------- Parcelas automáticas ----------
async function garantirMesParaParcela(chave, base){
  let d = await carregarDados(chave), criado = false;
  if (!d){ d = estruturaBaseDeMes(base); criado = true; }
  if (!d.cartoes[cartaoAtivo]) d.cartoes[cartaoAtivo] = [];
  return { d, criado };
}
async function sincronizarParcelasFuturas(item){
  if (!item.parceladoAuto || !item.parcelaGrupoId) return;
  for (const mesChave of mesesDisponiveis){
    if (mesChave <= mesAtivo) continue;
    const d = await carregarDados(mesChave); if (!d) continue;
    let mudou = false;
    Object.keys(d.cartoes).forEach(c => (d.cartoes[c]||[]).forEach(it => {
      if (it.parcelaGrupoId === item.parcelaGrupoId){
        if (Number(it.valor) !== Number(item.valor)){ it.valor = item.valor; mudou = true; }
        if ((it.terceiro||'') !== (item.terceiro||'')){ it.terceiro = item.terceiro || ''; mudou = true; }
      }
    }));
    if (mudou) await window.storage.set(chaveMes(mesChave), JSON.stringify(d), false);
  }
}
async function propagarParcelas(idxItem){
  const item = dados.cartoes[cartaoAtivo][idxItem];
  if (!item) return null;
  const m = String(item.parcela||'').trim().match(/^(\d{1,2})\/(\d{1,2})$/);
  if (!m) return null;
  const atual = Number(m[1]), total = Number(m[2]);
  if (!(total > 1) || !(atual >= 1) || atual > total) return null;
  if (item.parceladoAuto) return { faltam: 0, jaFeito: true };
  const faltam = total - atual;
  const grupoId = item.parcelaGrupoId || uid();
  item.parcelaGrupoId = grupoId;
  if (faltam <= 0){ item.parceladoAuto = true; autoSave(); return { faltam: 0 }; }
  let mesAlvo = mesAtivo; const novos = [];
  for (let i=1; i<=faltam; i++){
    mesAlvo = proximoMes(mesAlvo);
    const { d, criado } = await garantirMesParaParcela(mesAlvo, dados);
    if (criado) novos.push(mesAlvo);
    d.cartoes[cartaoAtivo].push({ id: uid(), data: item.data || '', descricao: item.descricao, parcela: `${atual+i}/${total}`, valor: item.valor,
      terceiro: item.terceiro || '', pendente:false, origem:'parcela-auto', parcelaGrupoId: grupoId,
      ...(item.carro ? { carro:true, tipo: item.tipo } : {}) });
    await window.storage.set(chaveMes(mesAlvo), JSON.stringify(d), false);
  }
  if (novos.length){
    novos.forEach(c => { if (!mesesDisponiveis.includes(c)) mesesDisponiveis.push(c); });
    mesesDisponiveis.sort(); await salvarIndice(); popularSeletorMes();
  }
  item.parceladoAuto = true; autoSave();
  return { faltam, ultimoMes: mesAlvo };
}

// ---------- Contas fixas: leva o valor para os meses seguintes já criados ----------
async function replicarDespesasFixas(){
  const fixas = dados.despesas.filter(d => d.fixo);
  const futuros = mesesDisponiveis.filter(m => m > mesAtivo);
  if (!fixas.length || !futuros.length) return;
  for (const mesChave of futuros){
    const d = await carregarDados(mesChave); if (!d) continue;
    let mudou = false;
    fixas.forEach(fix => {
      let alvo = fix.grupoFixoId ? d.despesas.find(x => x.grupoFixoId === fix.grupoFixoId) : null;
      if (!alvo) alvo = d.despesas.find(x => normHeader(x.nome) === normHeader(fix.nome));
      if (alvo){
        if (alvo.valor !== fix.valor || alvo.nome !== fix.nome || !alvo.fixo || (alvo.dia||null) !== (fix.dia||null)){ alvo.nome = fix.nome; alvo.valor = fix.valor; alvo.fixo = true; alvo.grupoFixoId = fix.grupoFixoId; alvo.dia = fix.dia || null; mudou = true; }
      } else { d.despesas.push({ id: uid(), nome: fix.nome, valor: fix.valor, fixo:true, grupoFixoId: fix.grupoFixoId, pago:false, dia: fix.dia || null }); mudou = true; }
    });
    if (mudou) await window.storage.set(chaveMes(mesChave), JSON.stringify(d), false);
  }
}

// ---------- Carro: gastos fixos vão para os meses seguintes já criados ----------
async function replicarCarroFixos(){
  const fixos = dados.carro.itens.filter(i => i.fixo && i.grupoFixoId);
  const futuros = mesesDisponiveis.filter(m => m > mesAtivo);
  if (!fixos.length || !futuros.length) return;
  for (const mesChave of futuros){
    const d = await carregarDados(mesChave); if (!d) continue;
    let mudou = false;
    fixos.forEach(fx => {
      const alvo = d.carro.itens.find(x => x.grupoFixoId === fx.grupoFixoId);
      if (alvo){
        if (alvo.valor !== fx.valor || alvo.descricao !== fx.descricao || alvo.tipo !== fx.tipo || alvo.pagamento !== fx.pagamento){
          Object.assign(alvo, { valor: fx.valor, descricao: fx.descricao, tipo: fx.tipo, pagamento: fx.pagamento, fixo:true }); mudou = true; }
      } else { d.carro.itens.push({ id: uid(), data:'', tipo: fx.tipo, descricao: fx.descricao, valor: fx.valor, pagamento: fx.pagamento, litros:0, km:0, fixo:true, grupoFixoId: fx.grupoFixoId, pago:false }); mudou = true; }
    });
    if (mudou) await window.storage.set(chaveMes(mesChave), JSON.stringify(d), false);

}
async function removerCarroFixoFuturo(grupoId){
  for (const mesChave of mesesDisponiveis.filter(m => m > mesAtivo)){
    const d = await carregarDados(mesChave); if (!d) continue;
    const antes = d.carro.itens.length;

    if (d.carro.itens.length !== antes) await window.storage.set(chaveMes(mesChave), JSON.stringify(d), false);

// ---------- Cálculos (uma regra só para tudo) ----------
// Carro: o que foi pago no cartão de crédito já vai aparecer na fatura,
// então só entra no "quanto sobra" o que foi pago em Pix/débito/dinheiro.
// Adivinha o tipo do gasto do carro pela descrição (para compras que vêm da fatura)
function tipoAuto(desc){
  const n = norm(desc);
  const tem = l => l.some(k => casa(n, k));
  if (tem(['posto','shell','ipiranga','petrobras','br mania','combust','gasolina','etanol','alcool','ale ','auto posto','graal'])) return 'combustivel';
  if (tem(['estacion','estapar','park','zona azul','rotativo'])) return 'estacionamento';
  if (tem(['lava','lavagem','lava jato','car wash','estetica auto'])) return 'lavagem';
  if (tem(['pedagio','sem parar','conectcar','veloe','move mais','taggy'])) return 'pedagio';
  if (tem(['ipva','detran','licenc','dpvat'])) return 'documentos';
  if (tem(['seguro','porto seguro auto','azul seguros','youse'])) return 'seguro';
  if (tem(['multa'])) return 'multa';
  if (tem(['oficina','mecanic','auto pecas','autopecas','pneu','borracharia','oleo','revisao','funilaria','bateria','alinhamento','balanceamento'])) return 'manutencao';
  return 'outros';
}
// Compras do carro que estão nos cartões: tudo do "cartão do carro" + o que foi lançado como carro em outro cartão
function itensCarroCartao(d){
  d = d || dados; const cc = plano.carro.cartao, out = [];
  Object.keys(d.cartoes||{}).forEach(c => (d.cartoes[c]||[]).forEach(i => { if (ehTerc(i)) return; if ((cc && c === cc) || i.carro) out.push({ c, i }); }));
  return out;
}
function carroTotais(d){
  d = d || dados;
  const proprios = (d.carro && d.carro.itens) || [];
  const doCartao = itensCarroCartao(d);
  const fora = proprios.filter(i => i.pagamento !== 'cartao').reduce((s,i)=>s+(Number(i.valor)||0),0);
  const antigosCartao = proprios.filter(i => i.pagamento === 'cartao').reduce((s,i)=>s+(Number(i.valor)||0),0); // versão anterior
  const cartaoV = doCartao.reduce((s,x)=>s+(Number(x.i.valor)||0),0);
  // lista única para a tela (gastos lançados aqui + compras do cartão)
  const itens = proprios.concat(doCartao.map(({c,i}) => ({ id: i.id, data: i.data, tipo: i.tipo || tipoAuto(i.descricao), descricao: i.descricao,
    valor: i.valor, pagamento:'cartao', cartao: c, litros: i.litros||0, km: i.km||0, parcela: i.parcela, pendente: i.pendente, _card: true })));
  return { total: fora + antigosCartao + cartaoV, fora, cartaoV, noCartao: antigosCartao + cartaoV, itens };
}
const guardadoTotal = () => plano.guardado.pessoas.reduce((s,p)=>s+saldoPessoa(p),0);
function saldoPessoa(p){ return (p.movs||[]).reduce((s,m)=>s+(m.tipo==='out' ? -1 : 1)*(Number(m.valor)||0),0); }
const somaObj = o => Object.values(o||{}).reduce((s,v)=>s+(Number(v)||0),0);
function totalCartao(n, d){ d = d || dados; return (d.cartoes[n]||[]).reduce((s,i)=>s+(Number(i.valor)||0),0); }
function totalCartaoMeu(n, d){ d = d || dados; return (d.cartoes[n]||[]).filter(i=>!ehTerc(i)).reduce((s,i)=>s+(Number(i.valor)||0),0); }
function totalTodosCartoes(){ return Object.keys(dados.cartoes).reduce((s,c)=>s+totalCartao(c),0); }
// quanto foi para as caixinhas num mês (guardado − retirado)
function caixinhasNoMes(chave){
  return plano.caixinhas.reduce((s,c) => s + (c.movs||[]).filter(m => (m.data||'').slice(0,7) === chave)
    .reduce((t,m) => t + (m.tipo === 'out' ? -1 : 1) * (Number(m.valor)||0), 0), 0);
}
function resumo(d, chave){
  chave = chave || mesAtivo;
  d = d || dados;
  const salario = somaObj(d.salarios);
  const contas = d.despesas.reduce((s,x)=>s+(Number(x.valor)||0),0);
  const cartaoBruto = Object.keys(d.cartoes).reduce((s,c)=>s+totalCartao(c,d),0);
  const cartaoMeu = Object.keys(d.cartoes).reduce((s,c)=>s+totalCartaoMeu(c,d),0);
  const ct = carroTotais(d);
  // cartaoMeu inclui o cartão do carro (é o que sai do bolso); para mostrar, separamos o carro
  const cartaoSemCarro = cartaoMeu - ct.cartaoV;
  return { salario, contas, cartaoBruto, cartaoMeu, cartaoSemCarro, terceiros: cartaoBruto - cartaoMeu,
           carro: ct.fora + ct.cartaoV, carroTotal: ct.total,
           caixinhas: caixinhasNoMes(chave),
           gastos: contas + cartaoMeu + ct.fora, sobra: salario - contas - cartaoMeu - ct.fora - caixinhasNoMes(chave),
           saldoConta: somaObj(d.saldos) - guardadoTotal() };
}
function faltaPagar(){
  const c = dados.despesas.filter(d => !d.pago).reduce((s,d)=>s+(Number(d.valor)||0),0);
  const f = Object.keys(dados.cartoes).filter(k => !dados.cartaoPago[k]).reduce((s,k)=>s+totalCartao(k),0);
  const car = dados.carro.itens.filter(i => !i.pago && i.pagamento !== 'cartao').reduce((s,i)=>s+(Number(i.valor)||0),0);
  return c + f + car;
}
function pendentes(){ const l = []; Object.keys(dados.cartoes).forEach(c => (dados.cartoes[c]||[]).forEach(i => { if (i.pendente) l.push({ c, i }); })); return l; }
function parcelasProj(){
  const out = [0,0,0,0,0,0,0];
  Object.values(dados.cartoes).forEach(lst => lst.forEach(i => {
    if (ehTerc(i)) return;
    const m = String(i.parcela||'').trim().match(/^(\d{1,2})\/(\d{1,2})$/); if (!m) return;
    const n = +m[1], t = +m[2]; if (t <= 1) return;
    const v = Number(i.valor)||0;
    for (let k = 0; k <= 6; k++) if (t - n >= k) out[k] += v;
  }));
  return out;
}

const CAT_REGRAS = [
  ['Compras online', ['mercado livre','mercadolivre','shopee','amazon','aliexpress','shein','magalu','magazine luiza','americanas','kabum','temu']],
  ['Assinaturas', ['netflix','spotify','prime video','amazon prime','disney','hbo','youtube','apple.com','icloud','google','globoplay','deezer','canva','chatgpt','openai','claude','max','paramount','tim','claro','vivo']],
  ['Delivery e restaurantes', ['ifood','rappi','uber eats','restaurante','lanchonete','pizza','burger','mcdonald','subway','cafe','cafeteria','sorveteria','padaria','churrasc','sushi','bar','bk']],
  ['Mercado', ['mercado','supermercado','atacadao','assai','carrefour','pao de acucar','hortifruti','sacolao','atacarejo','extra','mateus','supermarket']],
  ['Transporte', ['uber','99','posto','shell','ipiranga','petrobras','estacionamento','pedagio','sem parar','combustivel','taxi','onibus','metro']],
  ['Saúde', ['farmacia','drogaria','droga','raia','pacheco','pague menos','clinica','laboratorio','hospital','consulta','dental','odonto']],
  ['Beleza', ['salao','cilios','unha','depila','estetica','boticario','sephora','natura','barbearia','cabelo','make']],
  ['Vestuário', ['renner','riachuelo','c&a','zara','marisa','calcado','vestuario','moda','boutique']],
  ['Lazer e viagem', ['cinema','ingresso','sympla','hotel','booking','airbnb','decolar','latam','azul','gol','viagem','show','teatro','parque']],
  ['Casa', ['leroy','telha','moveis','tok stok','utilidades','construcao','eletro']]
];
const norm = t => semAcento(t).replace(/[^a-z0-9&. ]+/g,' ').replace(/\s+/g,' ').trim();
const chaveComerciante = t => norm(t).split(' ').filter(w => /^[a-z]{2,}/.test(w)).slice(0,2).join(' ');
const casa = (n, kw) => kw.length <= 3 ? new RegExp('(^|[^a-z0-9])' + kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '([^a-z0-9]|$)').test(n) : n.includes(kw);
function categoriaDe(desc){
  const ch = chaveComerciante(desc);
  if (ch && plano.regrasCat[ch]) return plano.regrasCat[ch];
  const n = norm(desc);
  for (const [cat, kws] of CAT_REGRAS) if (kws.some(kw => casa(n, kw))) return cat;
  return 'Outros';
}

let ctFixo = true, ctEditando = null, ctSemValorAberto = false;
// Lê "internet 120 dia 10", "conserto geladeira 250", "celular 59,90 dia 15 fixa"
function lerTextoConta(txt){
  let toks = String(txt||'').trim().split(/\s+/).filter(Boolean), dia = null, valor = 0, fixo = null;
  for (let i = 0; i < toks.length; i++){
    const t = toks[i].toLowerCase();
    if ((t === 'dia' || t === 'vence' || t === 'venc') && /^\d{1,2}$/.test(toks[i+1]||'')){ const n = +toks[i+1]; if (n >= 1 && n <= 31) dia = n; toks.splice(i, 2); i--; continue; }
    let m = t.match(/^dia(\d{1,2})$/); if (m && +m[1] >= 1 && +m[1] <= 31){ dia = +m[1]; toks.splice(i,1); i--; continue; }
    if (/^(fixa|fixo|mensal|sempre)$/.test(t)){ fixo = true; toks.splice(i,1); i--; continue; }
    if (/^(pontual|avulsa|avulso|só|so|única|unica)$/.test(t)){ fixo = false; toks.splice(i,1); i--; continue; }
  }
  for (let i = toks.length - 1; i >= 0; i--){
    const t = toks[i].replace(/^r\$/i,'');
    if (/^\d{1,3}(\.\d{3})*(,\d{1,2})?$|^\d+([.,]\d{1,2})?$/.test(t)){ valor = parseValorBR(t); toks.splice(i,1); if (/^r\$$/i.test(toks[i-1]||'')) toks.splice(i-1,1); break; }
  }
  let nome = toks.join(' ').trim(); if (nome) nome = nome.charAt(0).toUpperCase() + nome.slice(1);
  return { nome, valor, dia, fixo };
}
function lerCamposConta(box){
  const g = k => box.querySelector(`[data-ct="${k}"]`)?.value || '';
  const nome0 = g('nome').trim(), nome = nome0 ? nome0.charAt(0).toUpperCase() + nome0.slice(1) : '';
  const v = parseValorBR(g('valor')), n = Number(g('parc') || 1), cada = g('modo') === 'cada';
  const diaN = parseInt(g('dia'), 10), dia = diaN >= 1 && diaN <= 31 ? diaN : null;
  const valor = n > 1 && !cada ? Math.round(v / n * 100) / 100 : v;
  return { nome, valor, total: n > 1 ? (cada ? v * n : v) : v, n, dia, fixo: n > 1 ? false : ctFixo };
}

async function adicionarConta(box){

  if (!r.nome){ toast('Preencha o que é a conta.'); foco('nome'); return; }

    else { d = { id: uid(), nome: r.nome, valor: r.valor, fixo: r.fixo, grupoFixoId: r.fixo ? uid() : null, pago:false, dia: r.dia }; dados.despesas.push(d); }

let editandoId = null, qaTerc = '', qaData = '', secAberta = null;
const pad2 = n => String(n).padStart(2,'0');
// Em qual fatura (mês em que ela é paga) uma compra cai, pelo dia de fechamento do cartão
function mesDaFatura(card, iso){
  const fech = Number((plano.fechCartao||{})[card])||0, venc = Number(plano.vencCartao[card])||0;
  if (!fech || !/^\d{4}-\d{2}-\d{2}$/.test(iso||'')) return mesAtivo;
  const [a, m, d] = iso.split('-').map(Number);
  let chave = `${a}-${pad2(m)}`;
  if (d > fech) chave = proximoMes(chave);          // depois do fechamento → fatura seguinte
  if (venc && venc <= fech) chave = proximoMes(chave); // vence no mês seguinte ao fechamento
  return chave;
}
// Data de fechamento da fatura paga no mês "chave"
function fechamentoDe(card, chave){
  const fech = Number((plano.fechCartao||{})[card])||0, venc = Number(plano.vencCartao[card])||0; if (!fech) return null;
  let [a, m] = chave.split('-').map(Number);
  if (venc && venc <= fech){ m -= 1; if (m < 1){ m = 12; a -= 1; } }
  const ult = new Date(a, m, 0).getDate();
  return new Date(a, m-1, Math.min(fech, ult));
}
// Lê "ifood 45,90", "mercado 230 3x", "farmácia 89,90 12/11"
function lerTextoCompra(txt){
  let toks = String(txt||'').trim().split(/\s+/).filter(Boolean), parcela = '1/1', data = '', valor = 0, cada = false;
  toks = toks.filter(t => { if (/^(cada|parcela|p\/parcela|por)$/i.test(t)){ cada = true; return false; } if (/^(em|de|vezes)$/i.test(t)) return false; return true; });
  toks = toks.filter(t => {
    let m = t.match(/^(\d{1,2})x$/i) || t.match(/^x(\d{1,2})$/i); if (m && +m[1] >= 1){ parcela = `1/${+m[1]}`; return false; }
    m = t.match(/^(\d{1,2})\/(\d{1,2})$/);
    if (m && +m[1] <= +m[2] && +m[2] <= 48 && /^parc|^\d+\/\d+$/.test(t) && +m[2] > 12){ parcela = `${+m[1]}/${+m[2]}`; return false; }
    return true;
  });
  // data dd/mm ou dd/mm/aaaa (só se for uma data válida)
  toks = toks.filter(t => { if (data) return true; if (/^\d{1,2}\/\d{1,2}(\/\d{2,4})?$/.test(t)){ const iso = lerDataDigitada(t); if (iso){ data = iso; return false; } } return true; });
  // valor = último número
  for (let i = toks.length - 1; i >= 0; i--){
    const t = toks[i].replace(/^r\$/i,'');
    if (/^\d{1,3}(\.\d{3})*(,\d{1,2})?$|^\d+([.,]\d{1,2})?$/.test(t)){ valor = parseValorBR(t.includes(',') || !/\.\d{3}$/.test(t) ? t : t); toks.splice(i,1); if (/^r\$$/i.test(toks[i-1]||'')) toks.splice(i-1,1); break; }
  }
  let desc = toks.join(' ').replace(/^r\$\s*/i,'').trim();
  if (desc) desc = desc.charAt(0).toUpperCase() + desc.slice(1);
  const n = Number(parcela.split('/')[1]) || 1;
  // "230 3x" = total de 230 em 3 parcelas · "230 3x cada" = 3 parcelas de 230
  const valorParcela = n > 1 && !cada ? Math.round(valor / n * 100) / 100 : valor;
  return { desc, valor: valorParcela, total: n > 1 ? (cada ? valor * n : valor) : valor, parcela, data, n };
}
// Grava a compra na fatura certa (e as parcelas nos meses seguintes)
async function inserirCompra(card, item){
  const destino = mesDaFatura(card, item.data);
  const m = String(item.parcela||'1/1').match(/^(\d+)\/(\d+)$/), atual = m ? +m[1] : 1, total = m ? +m[2] : 1;
  const grupo = total > 1 ? uid() : null, novos = [];
  let chave = destino;
  for (let k = 0; atual + k <= total; k++){
    const it = { ...item, id: uid(), parcela: `${atual+k}/${total}` };
    if (grupo){ it.parcelaGrupoId = grupo; if (k === 0) it.parceladoAuto = true; else it.origem = 'parcela-auto'; }
    if (chave === mesAtivo){ (dados.cartoes[card] = dados.cartoes[card] || []).push(it); }
    else {
      let d = await carregarDados(chave);
      if (!d){ d = estruturaBaseDeMes(dados); novos.push(chave); }
      (d.cartoes[card] = d.cartoes[card] || []).push(it);
      await window.storage.set(chaveMes(chave), JSON.stringify(d), false);
    }
    chave = proximoMes(chave);
  }
  if (novos.length){ novos.forEach(c => { if (!mesesDisponiveis.includes(c)) mesesDisponiveis.push(c); }); mesesDisponiveis.sort(); await salvarIndice(); }
  await salvarDados();
  return { destino, total };
}
function lerCamposCompra(){
  const desc0 = ($('qaDesc')?.value || '').trim(), total = parseValorBR($('qaValor')?.value || ''), n = Number($('qaParc')?.value || 1);
  const dTxt = ($('qaData')?.value || '').trim(), data = dTxt ? lerDataDigitada(dTxt) : hojeISO();
  const desc = desc0 ? desc0.charAt(0).toUpperCase() + desc0.slice(1) : '';
  return { desc, total, n, valor: n > 1 ? Math.round(total / n * 100) / 100 : total, parcela: `1/${n}`, data };
}
function previaCompra(){
  const box = $('qaPrev'); if (!box) return;
  const r = lerCamposCompra(), card = cartaoAtivo;
  if (!r.desc && !r.total){ box.innerHTML = '<span class="muted">Preencha o que é e o valor. A data já vem com hoje.</span>'; return; }
  if (r.data === null){ box.innerHTML = '<span style="color:var(--red);font-size:12.5px">Data inválida. Use dd/mm/aaaa, ex.: 22/11/2026.</span>'; return; }
  const iso = r.data, destino = mesDaFatura(card, iso);
  box.innerHTML = `<span class="prev-pill">${esc(r.desc || 'falta o que é')}</span><span class="prev-pill"><b>${r.total ? fmtBRL(r.total) : 'falta o valor'}</b></span>`

    + `<span class="prev-pill dest">💳 ${esc(card)} → fatura de <b>${labelMes(destino)}</b></span>`
    + (!(plano.fechCartao||{})[card] ? `<div class="footnote" style="width:100%;margin:4px 0 0">⚙ Coloque o dia de fechamento do ${esc(card)} (no cartão abaixo) para o painel acertar sozinho em qual fatura a compra entra.</div>` : '');
}
async function lancarRapido(){
  if (!$('qaDesc')) return;
  qaTerc = $('qaTerc')?.value || '';
  const r = lerCamposCompra();
  if (r.data === null){ toast('Data inválida. Use dd/mm/aaaa, ex.: 22/11/2026.'); $('qaData').focus(); return; }
  if (!r.desc){ toast('Preencha o que é a compra.'); $('qaDesc').focus(); return; }

    pendente:false, origem:'manual', ...(ehCarro ? { tipo: tipoAuto(r.desc) } : {}) });

  setTimeout(() => { $('qaDesc')?.focus(); }, 30);

  lst.forEach(v => { if (v.dia){ const dt = new Date(ano, mes-1, Math.min(v.dia, ult)); v.diaReal = dt.getDate(); v.dias = Math.round((dt - hoje) / 864e5); } });

function svgGrafico(L, interativo){

  const y = v => pt + ph - v / maxV * ph, slot = pw / L.length, bw = Math.min(54, slot * 0.55);
  const barra = (x,yy,w,h,r) => { r = Math.min(r, h, w/2); return `M${x},${yy+h}V${yy+r}Q${x},${yy} ${x+r},${yy}H${x+w-r}Q${x+w},${yy} ${x+w},${yy+r}V${yy+h}Z`; };

function statsKm(d, kmAnterior){

  const valor = c.reduce((s,i)=>s+(Number(i.valor)||0),0);
  const comL = c.filter(i => Number(i.litros) > 0);
  const litros = comL.reduce((s,i)=>s+(Number(i.litros)||0),0);
  const valorComL = comL.reduce((s,i)=>s+(Number(i.valor)||0),0);
  return { valor, litros, preco: litros ? valorComL / litros : 0, itens: c };
}

const MESES_ABREV = {JAN:1,FEV:2,MAR:3,ABR:4,MAI:5,JUN:6,JUL:7,AGO:8,SET:9,OUT:10,NOV:11,DEZ:12};
// Monta a data AAAA-MM-DD da compra. Quando a fatura não traz o ano (ou traz cortado),
// usa o ano do mês da fatura — e volta 1 ano se o mês da compra for depois do mês da
// fatura (ex.: compra de dezembro numa fatura de janeiro). Data impossível → fica vazia.
function parseDataFatura(trecho, anoRef, mesRef){
  let dia, mes, ano = null;
  let m = trecho.match(/^(\d{2})\s*([A-Z]{3})$/);
  if (m && MESES_ABREV[m[2]]){ dia = +m[1]; mes = MESES_ABREV[m[2]]; }
  else {
    m = trecho.match(/^(\d{2})\/(\d{2})(?:\/(\d{1,4}))?$/);
    if (!m) return '';
    dia = +m[1]; mes = +m[2];
    if (m[3] && m[3].length === 2) ano = 2000 + Number(m[3]);
    else if (m[3] && m[3].length === 4) ano = Number(m[3]);
  }
  if (ano === null) ano = (mesRef && mes > mesRef) ? anoRef - 1 : anoRef;
  if (mes < 1 || mes > 12 || dia < 1 || dia > new Date(ano, mes, 0).getDate()) return '';
  return `${ano}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
}
async function extrairLinhasPdf(arrayBuffer){
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const TOL_Y = 3, linhas = [];
  for (let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const itens = content.items.filter(it => it.str && it.str.trim())
      .map(it => ({ str: it.str, x: it.transform[4], y: it.transform[5] }))
      .sort((a,b) => b.y - a.y || a.x - b.x);
    let grupo = [], refY = null;
    const flush = () => { if (!grupo.length) return; grupo.sort((a,b) => a.x - b.x); linhas.push(grupo.map(i => i.str).join(' ').replace(/\s+/g,' ').trim()); grupo = []; };
    itens.forEach(it => {
      if (refY === null || Math.abs(it.y - refY) <= TOL_Y){ grupo.push(it); refY = grupo.reduce((s,g)=>s+g.y,0) / grupo.length; }
      else { flush(); grupo = [it]; refY = it.y; }
    });
    flush();
  }
  return linhas.filter(Boolean);
}
function mesclarLinhasQuebradas(linhas){
  const soData = /^(\d{2}\s*(?:JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)|\d{2}\/\d{2}(?:\/\d{1,4})?)$/i;
  const temValor = /(-?[\d.]+,\d{2})\s*$/;
  const out = [];
  for (let i=0; i<linhas.length; i++){
    const a = (linhas[i]||'').trim(), b = (linhas[i+1]||'').trim();
    if (soData.test(a) && b && temValor.test(b) && !soData.test(b)){ out.push(`${a} ${b}`); i++; }
    else out.push(a);
  }
  return out;
}
function parseLinhasFatura(linhasBrutas, anoRef, mesRef){
  const linhas = mesclarLinhasQuebradas(linhasBrutas);
  const regexInicio = /^(\d{2}\s*(?:JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)|\d{2}\/\d{2}(?:\/\d{1,4})?)\s+(.+?)\s*(?:(\d{1,2}\/\d{1,2}))?\s*([-−]?)\s*(?:R\$\s*)?([\d.]+,\d{2})$/i;
  const regexDataNoMeio = /^(.*?)\s+(\d{2}\s*(?:JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)|\d{2}\/\d{2}(?:\/\d{1,4})?)\s+(.*?)\s*(?:(\d{1,2}\/\d{1,2}))?\s*([-−]?)\s*(?:R\$\s*)?([\d.]+,\d{2})$/i;
  const itens = [];
  const novo = (data, descricao, parcela, valor) => ({ id: uid(), data, descricao, parcela, valor, terceiro:'', terceiroPago:false, pendente:true, origem:'pdf' });
  for (const linha of linhas){
    let m = linha.match(regexInicio);
    if (m){
      const valor = parseValorBR((m[4]||'') + m[5]); if (valor <= 0) continue;
      itens.push(novo(parseDataFatura(m[1].toUpperCase().replace(/\s+/g,' ').trim(), anoRef, mesRef), m[2].replace(/R\$\s*$/i,'').trim(), m[3] || '', valor));
      continue;
    }
    const m2 = linha.match(regexDataNoMeio);
    if (m2){
      const data = parseDataFatura(m2[2].toUpperCase().replace(/\s+/g,' ').trim(), anoRef, mesRef);
      const valor = parseValorBR((m2[5]||'') + m2[6]);
      if (!data || valor <= 0) continue;
      itens.push(novo(data, `${m2[1]} ${m2[3]}`.replace(/\s+/g,' ').replace(/R\$\s*$/i,'').trim(), m2[4] || '', valor));
    }
  }
  return itens;
}
function lerPdfFatura(file){
  toast('Lendo a fatura…');
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const linhas = await extrairLinhasPdf(e.target.result);
      const itens = parseLinhasFatura(linhas, Number(mesAtivo.split('-')[0]), Number(mesAtivo.split('-')[1]));
      if (!itens.length){ toast('❌ Não reconheci compras nesse PDF. Lance pelo "＋ compra".'); return; }
      // compras já lançadas à mão (aba Carro ou "Incluir compra") não entram de novo
      const existentes = (dados.cartoes[cartaoAtivo]||[]).filter(i => ['manual','carro','parcela-auto'].includes(i.origem));
      const usados = new Set(), dia = iso => iso ? new Date(iso + 'T12:00:00').getTime() / 864e5 : null;
      const ehCarroCard = cartaoAtivo === plano.carro.cartao;
      const novos = itens.filter(n => {
        const par = existentes.find(e => !usados.has(e.id) && Math.abs((Number(e.valor)||0) - n.valor) < 0.01
          && (e.origem === 'parcela-auto' ? (e.parcela||'') === (n.parcela||'')
              : (!e.data || !n.data || Math.abs(dia(e.data) - dia(n.data)) <= 5)));
        if (par){ usados.add(par.id); return false; }
        if (ehCarroCard) n.tipo = tipoAuto(n.descricao);
        return true;
      });
      const repetidas = itens.length - novos.length;
      itens.length = 0; itens.push(...novos);
      if (!itens.length){ toast(`✅ Todas as ${repetidas} compra(s) dessa fatura já estavam lançadas. Nada foi duplicado.`); return; }
      const base = (dados.cartoes[cartaoAtivo]||[]).length;
      dados.cartoes[cartaoAtivo] = (dados.cartoes[cartaoAtivo]||[]).concat(itens);
      autoSave();
      let parcelas = 0;
      for (let i=0; i<itens.length; i++){ const r = await propagarParcelas(base + i); if (r && !r.jaFeito) parcelas += (r.faltam||0); }
      renderTudo();
      toast(`✅ ${itens.length} compra(s) importada(s) para ${cartaoAtivo}. Confira no passo 2.${repetidas ? ` ${repetidas} já estavam lançadas e não foram duplicadas.` : ''}${parcelas ? ` ${parcelas} parcela(s) futura(s) já criada(s).` : ''}`);
    }catch(err){ console.error(err); toast('❌ Não consegui ler esse PDF. Veja se não tem senha.'); }
  };
  reader.readAsArrayBuffer(file);
}

    case 'tercok': case 'tercdesf': {
      const p = b.dataset.p, val = act === 'tercok';
      Object.values(dados.cartoes).forEach(l => l.forEach(i => { if (ehTerc(i) && i.terceiro.trim() === p) i.terceiroPago = val; }));
      mudou(); break;
    }
  }
});

let sb = null;
function storageSupabase(){
  const T = 'app_storage';
  return {
    async get(key){ const { data, error } = await sb.from(T).select('value').eq('key', key).maybeSingle(); if (error) throw error; if (!data) throw new Error('not found'); return { key, value: data.value }; },
    async set(key, value){ const { error } = await sb.from(T).upsert({ key, value: String(value), updated_at: new Date().toISOString() }, { onConflict: 'user_id,key' }); if (error) throw error; return { key, value }; },
    async delete(key){ const { error } = await sb.from(T).delete().eq('key', key); if (error) throw error; return { key, deleted: true }; },
    async list(prefix){ const { data, error } = await sb.from(T).select('key').like('key', (prefix||'') + '%'); if (error) throw error; return { keys: data.map(r => r.key), prefix: prefix||'' }; }
  };
}

    box.innerHTML = `<div class="card" style="max-width:360px;width:100%;margin:0"><h3 class="card-title">🔐 Entrar</h3>

      <div class="footnote" id="lgMsg"></div></div>`;
    document.body.appendChild(box);

    const cred = () => ({ email: box.querySelector('#lgEmail').value.trim(), password: box.querySelector('#lgSenha').value });

async function migrarLocalParaSupabase(){
  const P = 'fin-pessoal:', linhas = [];
  for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.startsWith(P)) linhas.push({ key: k.slice(P.length), value: localStorage.getItem(k), updated_at: new Date().toISOString() }); }
  if (!linhas.length) return;
  const { data } = await sb.from('app_storage').select('key').eq('key','meses-indice').maybeSingle();
  if (data) return;
  if (!confirm('Enviar os dados salvos neste navegador para o Supabase?')) return;
  const { error } = await sb.from('app_storage').upsert(linhas, { onConflict: 'user_id,key' });
  if (error) alert('Erro ao enviar dados: ' + error.message);
}

async function exportarBackup(){
  const l = await window.storage.list('', false), out = {};
  for (const k of l.keys){ try{ const r = await window.storage.get(k, false); out[k] = r.value; }catch(e){} }
  if (!Object.keys(out).length) return alert('Não há dados para exportar.');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], { type:'application/json' }));
  a.download = 'backup-financeiro-' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importarBackup(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    try{
      const obj = JSON.parse(await inp.files[0].text()), ks = Object.keys(obj);
      if (!ks.length || !ks.includes('meses-indice')) return alert('Este arquivo não parece um backup do painel.');
      if (!confirm('Restaurar ' + ks.length + ' itens? Itens com o mesmo nome serão substituídos.')) return;
      for (const k of ks) await window.storage.set(k, String(obj[k]), false);
      location.reload();
    }catch(e){ alert('Erro ao restaurar: ' + e.message); }
  };
  inp.click();
}
// Apaga todos os meses, faturas, contas, teto e categorias (mantém só a configuração da nuvem/login)
async function zerarTudo(){
  if (!confirm('Isso vai APAGAR todos os meses, faturas, contas, o teto do cartão e as categorias.\n\nNão dá para desfazer. Continuar?')) return;
  if (confirm('Quer baixar um backup antes de apagar? (recomendado)\n\nOK = baixar backup primeiro · Cancelar = apagar sem backup')){
    await exportarBackup();
    await new Promise(r => setTimeout(r, 1500));
  }
  const conf = prompt('Para confirmar, digite ZERAR:');
  if ((conf || '').trim().toUpperCase() !== 'ZERAR'){ alert('Nada foi apagado.'); return; }
  clearTimeout(saveTimer);
  window.onbeforeunload = null; salvarDados = async () => true; // impede salvar de novo os dados antigos
  try{
    const l = await window.storage.list('', false);
    for (const k of l.keys){ try{ await window.storage.delete(k, false); }catch(e){ console.error(e); } }
    const P = 'fin-pessoal:', locais = [];
    for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.startsWith(P)) locais.push(k); }
    locais.forEach(k => localStorage.removeItem(k));
    alert('Pronto! Tudo foi apagado. O painel vai abrir do zero.');
  }catch(e){ alert('Erro ao apagar: ' + e.message); }
  location.reload();
}
function barraFerramentas(nuvem){
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:50;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end';

}

async function init(){
  await carregarPlano();
  const indice = await carregarIndice();
  if (!indice || !indice.length){
    mesesDisponiveis = [MES_SEMENTE]; mesAtivo = MES_SEMENTE; dados = novoMesVazio();
    await salvarIndice(); await salvarDados(); await salvarMesAtivoPref();
  } else {
    mesesDisponiveis = indice;
    const ultimo = mesesDisponiveis[mesesDisponiveis.length-1];
    if (!mesesDisponiveis.includes(MES_SEMENTE) && MES_SEMENTE > ultimo){
      // virou o mês: cria o mês atual sozinho, copiando fixas e salário
      const base = (await carregarDados(ultimo)) || novoMesVazio();
      mesesDisponiveis.push(MES_SEMENTE); mesesDisponiveis.sort(); await salvarIndice();
      mesAtivo = MES_SEMENTE; dados = estruturaBaseDeMes(base);
      await salvarDados(); await salvarMesAtivoPref();
    } else {
      mesAtivo = mesesDisponiveis.includes(MES_SEMENTE) ? MES_SEMENTE : ((await carregarMesAtivoPref()) || ultimo);
      if (!mesesDisponiveis.includes(mesAtivo)) mesAtivo = ultimo;
      dados = (await carregarDados(mesAtivo)) || novoMesVazio();
    }
  }
  normalizar(dados);
  cartaoAtivo = Object.keys(dados.cartoes)[0] || CARTOES_PADRAO[0];
  await migrarReservasAntigas();

  document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => ativarTab(btn.dataset.tab)));
  $('selMes').addEventListener('change', e => abrirMes(e.target.value));
  $('btnNovoMes').addEventListener('click', criarNovoMes);
  $('btnSalvarAgora').addEventListener('click', salvarAgora);
  $('btnPdf').addEventListener('click', gerarResumoPDF);
  $('btnTrancar').addEventListener('click', async () => { dados.trancado = !dados.trancado; await salvarDados(); renderTudo(); });
  window.addEventListener('beforeunload', () => { try{ salvarDados(); }catch(e){} });
  renderTudo();
}
async function iniciarComLogin(){
  let cfg = localStorage.getItem('fin-sb-config');
  if (!cfg && window.supabase){ const c = await telaConfig(); cfg = c ? JSON.stringify(c) : 'local'; }
  if (cfg && cfg !== 'local' && window.supabase){
    try{
      const c = JSON.parse(cfg);
      sb = window.supabase.createClient(c.url, c.key);
      const { data: { session } } = await sb.auth.getSession();
      if (!session) await telaLogin();
      window.storage = storageSupabase();
      await migrarLocalParaSupabase();
    }catch(e){ console.error(e); alert('Não foi possível conectar ao Supabase. Abrindo em modo local.'); sb = null; }
  }
  barraFerramentas(!!sb);
  await init();
}
iniciarComLogin();
</script>
